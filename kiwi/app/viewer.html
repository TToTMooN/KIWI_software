<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KIWI · Rerun</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f5f8fb; }
    canvas { display: block; width: 100%; height: 100%; }
    #status { position: absolute; inset: 0; display: grid; place-content: center; padding: 24px; text-align: center; color: #44546b; font: 13px system-ui, sans-serif; white-space: pre-wrap; background: #f5f8fb; }
    #status[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas id="viewer" aria-label="Rerun visualization"></canvas>
  <div id="status" role="status">Loading Rerun…</div>
  <script src="re_viewer.js"></script>
  <script>
    // Use the WebHandle shipped with our pinned Rerun SDK. All assets and
    // recordings stay on the same origin; no separate frontend build is needed.
    const status = document.getElementById('status');
    const source = new URLSearchParams(location.search).get('url');
    let handle;
    const bridge = window.kiwiViewer = {
      source,
      handle: null,
      // Polled by the workspace page.
      state: 'loading', // 'loading' | 'ready' | 'error'
      async applyLayers(encoded) {
        await this.ready;
        const bytes = Uint8Array.from(atob(encoded), c => c.charCodeAt(0));
        const channel = crypto.randomUUID();
        handle.open_channel(channel, 'KIWI layer visibility');
        try {
          handle.send_rrd_to_channel(channel, bytes);
        } finally {
          handle.close_channel(channel);
        }
        return true;
      },
      async showBlueprintPanel() {
        await this.ready;
        handle.override_panel_state('blueprint', 'expanded');
        return true;
      },
    };
    bridge.ready = (async () => {
      if (!source) throw new Error('Choose a recording in the data manager.');
      await wasm_bindgen({module_or_path: './re_viewer_bg.wasm'});
      handle = new wasm_bindgen.WebHandle({
        url: source,
        enable_history: false,
        persist: false,
        hide_welcome_screen: true,
      });
      await handle.start(document.getElementById('viewer'));
      bridge.handle = handle;
      status.hidden = true;
      // No fixed deadline: a panic is the failure signal; slowness is
      // reported, and the poll backs off.
      const slow = performance.now() + 15000;
      while (!handle.get_active_recording_id()) {
        if (handle.has_panicked()) throw new Error(handle.panic_message());
        const waiting = performance.now() > slow;
        if (waiting && status.hidden) {
          status.textContent = 'Still opening this recording…';
          status.hidden = false;
        }
        await new Promise(resolve => setTimeout(resolve, waiting ? 500 : 100));
      }
      status.hidden = true;
      bridge.state = 'ready';
      return true;
    })();
    bridge.ready.catch(error => {
      bridge.state = 'error';
      status.textContent = `Could not open Rerun. ${error.message || error}`;
      status.hidden = false;
      console.error(error);
    });
    window.addEventListener('pagehide', () => { if (handle) handle.destroy(); });
  </script>
</body>
</html>
