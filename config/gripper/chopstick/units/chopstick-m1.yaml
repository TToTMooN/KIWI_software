schema: chopstick_unit_v1
description: >-
  Chopstick gripper, chopstick design, physical build m1 with ArUco marker ID 1.
tool: chopstick

build:
  # This build's physical ArUco tag: ID 1, black-square edge 14 mm.
  marker:
    id: 1
    size: 0.014
  # Fixed camera<->marker pose
  fixed_pose:
    rvec:
    - 1.8290016340499122
    - -0.032318295721456475
    - -0.01677120561165797
    tvec:
    - -0.00014205080973838974
    - 0.04021909100990825
    - 0.030323637907744318
    fov_deg: 160.0
    out_size:
    - 1920
    - 1920
    lens: front

# Per-unit overrides over the tool's session: defaults. Omit to inherit.
